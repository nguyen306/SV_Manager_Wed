<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ký túc xá | Quản lý sinh viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="dormitory.css" />
</head>
<body data-root="../../" data-page="ky-tuc-xa">
  <div class="app">
    <!-- ========== SIDEBAR ========== -->
    <aside data-layout="sidebar"></aside>

    <!-- ========== MAIN ========== -->
    <div class="main">
      <header data-layout="navbar"></header>

      <main class="content dorm">
        <h1 class="dorm-title">QUẢN LÝ KÝ TÚC XÁ</h1>

        <!-- Tabs -->
        <nav class="dorm-tabs" role="tablist">
          <button role="tab" id="tab-register" data-tab="register" aria-controls="panel-register" aria-selected="true">
            <i class="fa-solid fa-door-open"></i> Đăng ký phòng ký túc xá
          </button>
          <button role="tab" id="tab-history" data-tab="history" aria-controls="panel-history" aria-selected="false">
            <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đăng ký của tôi
            <span class="tab-count" id="historyCount" hidden>0</span>
          </button>
        </nav>

        <!-- ========== TAB 1: ĐĂNG KÝ PHÒNG ========== -->
        <section class="tab-panel" id="panel-register" data-panel="register" role="tabpanel" aria-labelledby="tab-register">
          <!-- Thống kê nhanh -->
          <div class="stats" id="stats"></div>

          <!-- Thông báo phòng hiện tại -->
          <div class="notice" id="currentNotice" hidden></div>

          <!-- Bộ lọc -->
          <div class="filters">
            <div class="segmented" role="radiogroup" aria-label="Lọc theo khu">
              <button type="button" role="radio" data-gender="all" aria-checked="true">Tất cả</button>
              <button type="button" role="radio" data-gender="nam" aria-checked="false">
                <i class="fa-solid fa-mars"></i> Khu Nam
              </button>
              <button type="button" role="radio" data-gender="nu" aria-checked="false">
                <i class="fa-solid fa-venus"></i> Khu Nữ
              </button>
            </div>
            <label class="check">
              <input type="checkbox" id="onlyAvailable" />
              <span>Chỉ hiện phòng còn chỗ</span>
            </label>
            <div class="legend">
              <span><i class="dot dot--nam"></i>Nam</span>
              <span><i class="dot dot--nu"></i>Nữ</span>
              <span><i class="dot dot--full"></i>Hết chỗ</span>
              <span><i class="dot dot--mine"></i>Phòng của bạn</span>
            </div>
          </div>

          <!-- 3 khối loại phòng (render bằng JS) -->
          <div class="room-types" id="roomTypes"></div>
        </section>

        <!-- ========== TAB 2: LỊCH SỬ ĐĂNG KÝ ========== -->
        <section class="tab-panel" id="panel-history" data-panel="history" role="tabpanel" aria-labelledby="tab-history" hidden>
          <div class="box box--flush">
            <div class="box__head">
              <h2><i class="fa-solid fa-clock-rotate-left"></i> Lịch sử đăng ký của tôi</h2>
            </div>
            <div class="table-wrap">
              <table class="history-table">
                <thead>
                  <tr>
                    <th>STT</th>
                    <th>Họ và tên</th>
                    <th>Mã sinh viên</th>
                    <th>Lớp quản lý</th>
                    <th>Phòng</th>
                    <th>Loại phòng</th>
                    <th>Mức giá</th>
                    <th>Ngày đăng ký</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="historyBody"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- ========== POPUP XÁC NHẬN ========== -->
  <dialog class="modal" id="confirmModal" aria-labelledby="modalTitle">
    <form method="dialog">
      <div class="modal__head">
        <div class="modal__icon"><i class="fa-solid fa-building"></i></div>
        <div>
          <h3 id="modalTitle">Xác nhận đăng ký phòng</h3>
          <p>Vui lòng kiểm tra lại thông tin trước khi xác nhận</p>
        </div>
      </div>
      <div class="modal__body" id="modalBody"></div>
      <div class="modal__actions" id="modalActions">
        <button type="submit" value="cancel" class="btn btn--ghost">Hủy</button>
        <button type="submit" value="confirm" class="btn btn--primary" id="confirmBtn">
          <i class="fa-solid fa-check"></i> Xác nhận đăng ký
        </button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../../data/students.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="dormitory.js"></script>
</body>
</html>
