<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký phòng & ca dạy | Giảng viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="giang-vien.css" />
</head>
<body data-root="../../" data-page="gv-dang-ky-phong">
  <div class="app">
    <aside data-layout="sidebar"></aside>
    <div class="main">
      <header data-layout="navbar"></header>

      <main class="content page">
        <div class="page-head">
          <div>
            <h1 class="page-title">ĐĂNG KÝ PHÒNG &amp; CA DẠY</h1>
            <p class="page-sub">Chọn ngày, ca học rồi bấm vào một phòng còn trống để đăng ký</p>
          </div>
        </div>

        <section class="box box--flush">
          <div class="toolbar">
            <label>Ngày dạy <input type="date" class="ui-input" id="date" /></label>
            <label>Ca học <select class="ui-select" id="slot"></select></label>
            <label>Loại phòng <select class="ui-select" id="type"><option value="">Tất cả</option></select></label>
            <label class="ui-check" style="flex-direction:row;align-self:center"><input type="checkbox" id="onlyFree" /> Chỉ hiện phòng trống</label>
          </div>
          <div class="box__body">
            <div class="note" id="slotNote" hidden></div>
            <div class="room-grid" id="roomGrid"></div>
          </div>
        </section>

        <section class="box box--flush">
          <div class="box__head">
            <h2><i class="fa-solid fa-list-check"></i> Phòng & ca dạy đã đăng ký</h2>
            <small id="myCount">0</small>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Ngày</th><th>Ca</th><th>Phòng</th><th>Mục đích</th><th>Lớp học phần</th><th>Ghi chú</th><th>Trạng thái</th><th></th></tr></thead>
              <tbody id="myBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../../data/students.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="giang-vien.js"></script>
  <script src="dang-ky-phong.js"></script>
</body>
</html>
