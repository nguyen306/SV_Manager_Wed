<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lịch dạy | Giảng viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="giang-vien.css" />
</head>
<body data-root="../../" data-page="gv-lich-day">
  <div class="app">
    <aside data-layout="sidebar"></aside>
    <div class="main">
      <header data-layout="navbar"></header>

      <main class="content page">
        <div class="page-head">
          <div>
            <h1 class="page-title">LỊCH GIẢNG DẠY</h1>
            <p class="page-sub" id="teacherSub">—</p>
          </div>
          <div class="week-nav" aria-label="Chọn tuần">
            <button type="button" class="icon-action" id="prevWeek" aria-label="Tuần trước"><i class="fa-solid fa-chevron-left"></i></button>
            <button type="button" class="btn btn--ghost btn--sm" id="thisWeek">Tuần này</button>
            <button type="button" class="icon-action" id="nextWeek" aria-label="Tuần sau"><i class="fa-solid fa-chevron-right"></i></button>
            <input type="date" class="ui-input ui-input--sm" id="weekPicker" aria-label="Chọn ngày" />
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <section class="box box--flush">
          <div class="box__head">
            <h2><i class="fa-regular fa-calendar"></i> <span id="weekTitle">—</span></h2>
            <div class="legend">
              <span><i class="dot dot--class"></i>Lịch chính thức</span>
              <span><i class="dot dot--booking"></i>Đăng ký phòng / dạy bù</span>
            </div>
          </div>
          <div class="table-wrap">
            <table class="week" id="weekTable"></table>
          </div>
        </section>

        <section class="box box--flush">
          <div class="box__head box__head--soft">
            <h2><i class="fa-solid fa-chalkboard-user"></i> Lớp học phần phụ trách</h2>
            <a class="btn btn--primary btn--sm" id="bookLink" href="#"><i class="fa-solid fa-door-open"></i> Đăng ký phòng</a>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Năm học</th><th>Môn học</th><th>Lớp</th><th class="center">Số TC</th><th>Lịch học</th><th class="num">Sĩ số</th></tr></thead>
              <tbody id="sectionBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../../data/students.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="giang-vien.js"></script>
  <script src="lich-day.js"></script>
</body>
</html>
