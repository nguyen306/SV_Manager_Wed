<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lớp học phần | Giảng viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="giang-vien.css" />
</head>
<body data-root="../../" data-page="gv-lop-hoc-phan">
  <div class="app">
    <aside data-layout="sidebar"></aside>
    <div class="main">
      <header data-layout="navbar"></header>

      <main class="content page">
        <div class="page-head">
          <div>
            <h1 class="page-title">QUẢN LÝ LỚP HỌC PHẦN</h1>
            <p class="page-sub" id="weightNote">—</p>
          </div>
        </div>

        <div class="section-layout">
          <!-- Danh sách lớp học phần -->
          <aside class="box box--flush">
            <div class="box__head"><h2><i class="fa-solid fa-chalkboard-user"></i> Lớp học phần</h2><small id="sectionCount">0</small></div>
            <div class="section-list" id="sectionList" role="listbox" aria-label="Chọn lớp học phần"></div>
          </aside>

          <!-- Bảng điểm lớp -->
          <section class="box box--flush">
            <div class="box__head">
              <h2><i class="fa-solid fa-table-list"></i> <span id="sectionTitle">—</span></h2>
              <small id="sectionMeta"></small>
            </div>
            <div class="toolbar">
              <label class="grow">Tìm sinh viên
                <span class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
                  <input type="search" class="ui-input" id="search" placeholder="Mã SV hoặc họ tên..." /></span>
              </label>
              <div class="toolbar__actions">
                <span class="dirty-note" id="dirtyNote" hidden></span>
                <button type="button" class="btn btn--ghost" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Hoàn tác</button>
                <button type="button" class="btn btn--primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Lưu điểm</button>
              </div>
            </div>
            <div class="stats stats--inline" id="stats"></div>
            <div class="table-wrap">
              <table class="tbl">
                <thead><tr>
                  <th>STT</th><th>Mã SV</th><th>Họ và tên</th>
                  <th class="center">Giữa kỳ</th><th class="center">Cuối kỳ</th>
                  <th class="center">Tổng kết (hệ 10)</th><th class="center">Hệ 4</th><th class="center">Chữ</th>
                  <th class="center">Điểm hệ 4 hiện có<small>(theo Excel)</small></th>
                </tr></thead>
                <tbody id="body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <script src="../../data/students.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="giang-vien.js"></script>
  <script src="lop-hoc-phan.js"></script>
</body>
</html>
