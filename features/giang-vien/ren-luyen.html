<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Điểm rèn luyện | Giảng viên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="giang-vien.css" />
</head>
<body data-root="../../" data-page="gv-ren-luyen">
  <div class="app">
    <aside data-layout="sidebar"></aside>
    <div class="main">
      <header data-layout="navbar"></header>

      <main class="content page">
        <div class="page-head">
          <div>
            <h1 class="page-title">ĐÁNH GIÁ ĐIỂM RÈN LUYỆN</h1>
            <p class="page-sub">Thang điểm 100 · Xuất sắc ≥ 90 · Tốt ≥ 80 · Khá ≥ 65 · Trung bình ≥ 50 · Yếu ≥ 35 · Kém &lt; 35</p>
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <section class="box box--flush">
          <div class="toolbar">
            <label>Năm học <select class="ui-select" id="year"></select></label>
            <label>Lớp phụ trách <select class="ui-select" id="lop"></select></label>
            <label class="grow">Tìm sinh viên
              <span class="search-box"><i class="fa-solid fa-magnifying-glass"></i>
                <input type="search" class="ui-input" id="search" placeholder="Mã SV hoặc họ tên..." /></span>
            </label>
            <div class="toolbar__actions">
              <span class="dirty-note" id="dirtyNote" hidden></span>
              <button type="button" class="btn btn--ghost" id="resetBtn"><i class="fa-solid fa-rotate-left"></i> Hoàn tác</button>
              <button type="button" class="btn btn--primary" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Lưu điểm</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>STT</th><th>Mã SV</th><th>Họ và tên</th><th class="center">Điểm (0–100)</th><th>Xếp loại</th><th>Ghi chú</th><th>Cập nhật</th></tr></thead>
              <tbody id="body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../../data/students.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="giang-vien.js"></script>
  <script src="ren-luyen.js"></script>
</body>
</html>
