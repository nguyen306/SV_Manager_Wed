<!DOCTYPE html>

          <i class="fa-solid fa-user"></i><span>Profile</span>
        </a>
        <a href="hoc-tap.html" class="menu-item">
          <i class="fa-solid fa-book-open"></i><span>Học tập</span>
        </a>
        <a href="dormitory.html" class="menu-item">
          <i class="fa-solid fa-building"></i><span>Ký túc xá</span>
        </a>
        <a href="library.html" class="menu-item">
          <i class="fa-solid fa-book"></i><span>Thư viện</span>

        <a href="lich-hoc.html" class="menu-item">

        </a>
      </nav>

      <div class="sidebar__footer">
        <a href="#" class="menu-item">
          <i class="fa-solid fa-gear"></i><span>Cài đặt</span>

          <i class="fa-solid fa-right-from-bracket"></i><span>Đăng xuất</span>
        </a>
      </div>
    </aside>

    <!-- ========== MAIN ========== -->
    <div class="main">
      <!-- NAVBAR -->
      <header class="navbar">
        <form class="search" role="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="Tìm kiếm sinh viên, môn học, tài liệu..." />
        </form>

        <div class="navbar__right">
          <button class="icon-btn" aria-label="Thông báo">
            <i class="fa-regular fa-bell"></i>
            <span class="badge">3</span>
          </button>
          <button class="icon-btn" aria-label="Tin nhắn">
            <i class="fa-regular fa-envelope"></i>
          </button>

          <div class="user">
            <img src="" alt="Ảnh đại diện" class="user__avatar" />
            <div class="user__info">
              <span class="user__name">Nguyễn Văn A</span>
              <span class="user__role">MSSV: 21110001</span>
            </div>
            <i class="fa-solid fa-chevron-down user__caret"></i>
          </div>
        </div>
      </header>

      <!-- NỘI DUNG -->
      <main class="content">
        <h1>Tin tức</h1>
        <div class="grid">
          <div class="card">Thẻ nội dung 1</div>
          <div class="card">Thẻ nội dung 2</div>
